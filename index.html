<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f766e">
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header (month switcher) + 3 views (요약 / 내역 / 추이) + bottom tab bar. Phone first. */
:root{
  --bg:#f2f5f4; --card:#ffffff; --text:#14201e; --sub:#65736f; --line:#e1e8e6; --soft:#e9efed;
  --accent:#0f766e; --accent-soft:#d5ece8; --on-accent:#ffffff;
  --up:#c2410c; --down:#0f766e; --over:#b91c1c; --warn:#b45309; --on-warn:#ffffff;
  --shadow:0 1px 2px rgba(20,32,30,.05),0 4px 14px rgba(20,32,30,.05);
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --card:#162120; --text:#e8f0ee; --sub:#92a39f; --line:#243230; --soft:#1d2b29;
  --accent:#3fc3b4; --accent-soft:#17403b; --on-accent:#08201d;
  --up:#fb923c; --down:#3fc3b4; --over:#f87171; --warn:#fbbf24; --on-warn:#1b1300; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --card:#162120; --text:#e8f0ee; --sub:#92a39f; --line:#243230; --soft:#1d2b29;
  --accent:#3fc3b4; --accent-soft:#17403b; --on-accent:#08201d;
  --up:#fb923c; --down:#3fc3b4; --over:#f87171; --warn:#fbbf24; --on-warn:#1b1300; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}   /* no pinch / double-tap zoom (scrolling stays) */
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--sub);letter-spacing:0}
.todaybtn{flex:none;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.todaybtn:active{background:var(--accent-soft)}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.mnav button{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--sub);font-size:18px;line-height:1}
.mnav button:disabled{opacity:.25;cursor:default}
.mnav .sel{position:relative;min-width:92px;text-align:center;font-weight:700;font-size:15px;padding:0 6px}
.mnav select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;font-weight:500;color:var(--sub);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 em{font-style:normal;font-size:12px}
.sub{color:var(--sub);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

/* hero */
.hero{padding:20px 18px 18px}
.hero .lbl{font-size:13px;color:var(--sub)}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:2px 0 6px}
.hero .big span{font-size:18px;font-weight:500;margin-left:3px;color:var(--sub);letter-spacing:0}
.delta{font-size:13px;font-weight:500}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.meter{margin-top:16px}
.meter-track{position:relative;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.meter-spent{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px 0 0 7px}
.meter-spent.over{background:var(--over)}
.meter-proj{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.28}
.meter-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.meter-txt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--sub)}
.meter-txt b{color:var(--text);font-weight:600}
.st-ok{color:var(--down)}.st-risk{color:var(--warn)}.st-over{color:var(--over)}

/* donut + category list */
.donut-wrap{display:flex;justify-content:center;margin:2px 0 14px}
.donut{position:relative;width:176px;height:176px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-c b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.donut-c span{font-size:12px;color:var(--sub)}
.cat{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0 10px}
.cat:first-of-type{border-top:0}
.cat-top{display:flex;align-items:center;gap:8px}
.cat-name{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.cat-pct{font-size:12px;color:var(--sub);width:38px;text-align:right}
.cat-amt{font-weight:600;min-width:84px;text-align:right}
.cat-bar{height:5px;border-radius:3px;background:var(--soft);margin:8px 0 0 17px;position:relative;overflow:hidden}
.cat-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.cat-bar i.over{background:var(--over)!important}
.cat-sub{margin:4px 0 0 17px;font-size:12px;color:var(--sub)}
.cat-sub .over{color:var(--over)}

/* daily chart */
.days{display:flex;align-items:flex-end;gap:2px;height:84px}
.days div{flex:1;min-width:0;background:var(--accent);opacity:.55;border-radius:3px 3px 0 0;min-height:2px}
.days div.today{opacity:1}
.days div.zero{background:var(--soft);opacity:1}
.days-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}

/* top stores */
.store{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.store:first-of-type{border-top:0}
.store .rk{width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.store .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.store .nm small{display:block;color:var(--sub);font-size:12px}
.store .am{font-weight:600}

/* list view */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 38px 11px 38px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:var(--sub);font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sm{font-size:12px;padding:3px 10px;color:var(--sub)}
.chip.sm.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.bar-info{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 6px;font-size:13px;color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:3px 12px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--soft);color:var(--text);font-weight:600}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:16px 4px 6px;font-weight:500}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:6px;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,var(--line))}
.row .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.row .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 8px;background:var(--soft);color:var(--text);font-size:12px;line-height:20px}
.row .am{font-weight:600;white-space:nowrap}
.row .am.neg{color:var(--down)}
.row.click{cursor:pointer}
.row.click .am::after{content:" ▸";color:var(--sub);font-size:11px}
.row.open .am::after{content:" ▾"}
.items{display:none;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.row.open .items{display:block}
.item{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--sub);padding:2px 0}
.item span:first-child{min-width:0;overflow-wrap:anywhere}
.warn{color:var(--warn);font-size:12px;font-weight:500}
.stg{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;line-height:19px;border-radius:999px;vertical-align:1px;margin-left:4px;white-space:nowrap}
.stg.cf{background:var(--accent);color:var(--on-accent)}
.stg.vf{border:1px solid var(--accent);color:var(--accent)}
.stg.xs{border:1px dashed var(--sub);color:var(--sub)}
.stg.gp{background:var(--over);color:#fff}
.stg.wt{border:1px solid var(--sub);color:var(--sub)}
.sl{animation:slL .24s ease-out}
.sr{animation:slR .24s ease-out}
@keyframes slL{from{opacity:.35;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:.35;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sl,.sr{animation:none}}
.gearic{flex:none;width:36px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0}
.gearic:active{background:var(--soft)}
.gearrow{display:flex;justify-content:flex-end;margin:-4px 0 8px}
.gear{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500}
.gear:active{background:var(--soft)}
#setBack{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#setBox{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.set-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:-14px;background:var(--card);padding:4px 0 8px;z-index:1}
.set-hd b{font-size:16px}
.set-hd button{border:0;background:var(--soft);color:var(--text);border-radius:999px;padding:5px 14px;font-size:13px}
#setBody h4{margin:16px 0 6px;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.02em}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow span small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.srow select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:16px;max-width:46%}
.sw{position:relative;flex:none;width:44px;height:26px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.xrule{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;gap:8px}
.xrule .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.xrule select,.xrule input[type=text],.xrule input[type=number]{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 9px;font-size:16px;min-width:0;width:100%}
.xrule .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xrule label span{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
.xrule .del{border:0;background:none;color:var(--over);font-size:13px}
.xprev{font-size:13px;color:var(--sub);margin:6px 0}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}
.cat-modal-note{font-size:12px;color:var(--sub);margin:0 0 10px}
#catBack{position:fixed;inset:0;z-index:68;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#catBox,#treeBox,#budBox{background:var(--card);color:var(--text);width:100%;max-width:620px;height:92vh;height:92dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0;padding:14px 16px 0}
#catBox .set-hd,#treeBox .set-hd,#budBox .set-hd{position:static;flex:none;margin:0;padding:0 0 10px;border-bottom:1px solid var(--line)}
#catBody,#treeBody,#budBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px))}
#budBack,#catBack,#treeBack,#setBack{overscroll-behavior:contain;touch-action:pan-y}
body:has(#budBack:not([hidden])),body:has(#catBack:not([hidden])),body:has(#treeBack:not([hidden])),body:has(#setBack:not([hidden])){overflow:hidden}
#budBack,#treeBack{position:fixed;inset:0;z-index:72;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#treeBack[hidden],#budBack[hidden]{display:none}
.vd-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--text);font-size:15px}
.vd-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}.vd-row .nm small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.vd-row .am{font-weight:600}.vd-row .ar{color:var(--sub)}
.vd-bar{height:5px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}.vd-bar i{display:block;height:100%;border-radius:3px}
.bd-row{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.bd-row small{display:block;color:var(--sub);font-size:11px}
.bd-row input{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 9px;font-size:16px;width:100%;text-align:right}
.bd-row input.man{border-color:var(--accent);background:var(--accent-soft)}
.bd-sum{position:sticky;top:-10px;background:var(--card);padding:10px 0;z-index:1;font-size:13px;color:var(--sub)}
.bd-sum select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 8px;font-size:15px;margin-right:6px}
.tr1{margin:0 0 12px;border-radius:12px;padding:4px}.tr1.drop{background:var(--accent-soft);outline:2px dashed var(--accent)}
#treeBody .tr2>div[data-m]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dgh{position:fixed;z-index:90;pointer-events:none;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.3);transform:scale(1.04) rotate(-1.5deg);opacity:.96}
.tr2>div.dragging{opacity:.35}.tr1>b{display:flex;align-items:center;gap:8px;font-size:15px}.tr1>b i{width:10px;height:10px;border-radius:50%;flex:none}
.tr1>b small{font-weight:400;color:var(--sub);font-size:12px}
.tr2{margin:6px 0 0 5px;padding-left:14px;border-left:2px solid var(--line)}
.tr2>div{font-size:14px;font-weight:600;margin-top:6px}.tr2>div small{font-weight:400;color:var(--sub);font-size:12px}
.tr3{margin:2px 0 0 4px;padding-left:12px;border-left:1px dashed var(--line);font-size:13px;color:var(--sub);line-height:1.7}
.tr3 span{display:inline-block;background:var(--soft);border-radius:999px;padding:0 9px;margin:2px 4px 2px 0;line-height:1.6}
.ce-tabs{display:flex;gap:6px;margin:0 0 12px;position:sticky;top:-10px;background:var(--card);padding:10px 0 8px;z-index:1}
.ce-tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:7px 4px;font-size:13px;font-weight:600}
.ce-tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.ce-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;gap:8px}
.ce-card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ce-card .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ce-card .sub{font-size:12px;color:var(--sub)}
.ce-card select,.ce-card input[type=text]{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 9px;font-size:16px;min-width:0;width:100%}
.ce-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ce-card label>span{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
.ce-card .mini{border:0;background:none;color:var(--over);font-size:13px}
.ce-card input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0;background:var(--card)}
.ce-mid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.ce-add{display:flex;gap:8px}
.ce-add input{flex:1}
.ce-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 4px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:12px}
.ce-foot .btn{flex:1}
.trpick{display:flex;align-items:center;gap:8px;margin-top:4px}
.trpick select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:16px}
.steps{display:flex;align-items:stretch;gap:4px;margin:2px 0 12px}
.steps .step{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;text-align:left;font-size:13px;font-weight:700;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .step small{display:block;font-size:10px;font-weight:500;color:var(--sub);margin-bottom:1px}
.steps .step.done{color:var(--text);background:var(--soft)}
.steps .step.cur{border-color:var(--accent);color:var(--accent)}
.steps .step.cur small{color:var(--accent)}
.steps .arr{align-self:center;color:var(--sub);font-size:14px}
.cat-kids{margin:3px 0 0 17px;font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.crumb{border:0;background:none;padding:0;font:inherit;color:var(--text);font-weight:600}
.crumb:last-of-type{font-weight:700}
.chev{color:var(--sub);margin-left:6px;font-size:16px}
.xsbar{border-color:var(--sub);background:var(--card)}

function toJpeg(file) {   // shrink (long side 2600px) and re-encode as JPEG so uploads stay small but text stays readable

        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

// ---------- 좌/우로 밀어서 달 이동 (사진 탭 제외) ----------
let sw = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1 || !$("helpBack").hidden || $("appView").hidden) { sw = null; return; }
  const t = e.touches[0];
  sw = {x: t.clientX, y: t.clientY, t: Date.now(),
        skip: !!e.target.closest(".chips,.bars,.scroll,table,input,select,textarea,.days,details[open],.thumbs") || t.clientX < 24 || t.clientX > window.innerWidth - 24};   // scrollable strips and the screen edge (browser back) keep their own swipe
}, {passive: true});
document.addEventListener("touchend", e => {
  if (!sw) return; const g = sw; sw = null; if (g.skip || state.tab === "photo" || !pref("g_swipe")) return;
  const t = e.changedTouches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < 1.6 * Math.abs(dy) || Date.now() - g.t > 700) return;
  swipeMonth(dx < 0 ? 1 : -1);                                       // finger to the left = next month, to the right = previous month
}, {passive: true});
function swipeMonth(dir) {
  const flash = () => { const m = document.querySelector("main"); m.classList.remove("sl", "sr"); void m.offsetWidth; m.classList.add(dir > 0 ? "sl" : "sr"); };
  if (state.tab === "trend") {                                       // the trend tab has no month picker: move the selected bar
    const ms = trendRange(), i = ms.indexOf(state.tmonth) + dir; if (i < 0 || i >= ms.length) return;
    state.tmonth = ms[i]; renderTrend(); flash(); return;
  }
  if (state.month === "전체") return;
  const i = MONTHS.indexOf(state.month) + dir; if (i < 0 || i >= MONTHS.length) return;
  setMonth(MONTHS[i]); flash();
}

// ---------- data: Supabase (login by name + PIN; only registered viewers can read) ----------
const API = "https://iqzswnpfxdjsnxlvisxf.supabase.co/rest/v1/rpc/";
const KEY = "sb_publishable_xL6Ih_CqeQ0PzfTJvJxMew_BtSMd68T";   // public key; data is protected by name+PIN in g_load
const SK = "gagyebu-login-v1";
const ERR = {bad_login: "이름 또는 PIN이 맞지 않아요.", locked: "5번 틀려서 10분간 잠겼어요. 잠시 뒤에 다시 해주세요.", network: "인터넷 연결을 확인해주세요."};
const rpc = (fn, args) => fetch(API + fn, {method: "POST", headers: {apikey: KEY, "Content-Type": "application/json"}, body: JSON.stringify(args)})
  .then(r => r.json()).catch(() => ({ok: false, error: "network"}));
function view(v) { $("loginView").hidden = v !== "login"; $("loadView").hidden = v !== "load"; $("appView").hidden = v !== "app"; }
function showLogin(msg) { view("login"); $("loginMsg").textContent = msg || ""; $("loginMsg").className = "msg" + (msg ? " bad" : ""); }
function applyData(r) {
  COLORS = (r.config && r.config.colors) || {};
  SPREFS = r.prefs || {}; XS_DEFAULT = (r.config && r.config.xs_default) || [];
  if (!applyData.once) { applyData.once = true; state.sort = pref("l_sort"); state.limit = +pref("l_limit"); }
  CFG_ALIAS = (r.config && r.config.alias) || {}; CFG_VER = (r.config && r.config.tree_ver) || 1;
  CFG_TREE = (r.config && r.config.tree) || {}; CFG_COLORS1 = (r.config && r.config.colors1) || {};
  BUDGET = (r.config && r.config.budget) || BUDGET;
  COVER = (r.config && r.config.cover) || "";
  $("updated").textContent = r.config && r.config.updated ? "갱신 " + r.config.updated : "";
  ROWS = Object.keys(r.months || {}).sort().flatMap(k => r.months[k]);
  if (!ROWS.length) { view("load"); $("loadView").textContent = "아직 올라온 가계부 데이터가 없어요."; return; }
  MONTHS = [...new Set(ROWS.map(x => x.date.slice(0, 7)))].sort();
  applyCats();
  const sm = fetchStore("g-month"), st = fetchStore("g-tab");
  if (!state.month) state.month = (sm && (sm === "전체" || MONTHS.includes(sm))) ? sm : MONTHS[MONTHS.length - 1];
  CAN_UP = !!r.can_upload;
  IGN = new Map((r.ignored || []).map(x => [x.key, x.label]));
  $("photoTab").hidden = !CAN_UP;
  if (st === "gap") st = "unv";
  if (st && ["sum", "list", "unv", "trend", "vendor"].concat(CAN_UP ? ["photo"] : []).includes(st) && !renderTrend.started) state.tab = st;
  if (state.tab === "photo" && !CAN_UP) state.tab = "sum";
  renderTrend.started = true;
  updateUnvBadge(); updateGapBadge();
  view("app"); renderHeader(); show(state.tab);
  syncLocalPrefs();
}
async function syncLocalPrefs() {   // choices saved only on this phone (server was not ready) go up as soon as the server accepts them
  if (!CAN_UP) return; const c = fetchStore(SK); if (!c) return;
  for (const [lk, key, get] of [["g-xsrules", "stat", v => ({rules: v})], ["g-cat", "cat", v => v], ["g-budget", "budget", v => v]]) {
    const v = fetchStore(lk); if (!v) continue;
    const r = await rpc("g_pref_set", {p_name: c.name, p_pin: c.pin, p_key: key, p_value: get(v)});
    if (r.ok) { SPREFS[key] = get(v); store(lk, undefined); toast("이 폰에만 있던 설정을 서버에 올렸어요 · 이제 모두에게 적용돼요", 4000); applyCats(); show(state.tab, true); }
  }
}
async function load(name, pin, fromForm) {
  if (!ROWS.length) { view("load"); $("loadView").textContent = "불러오는 중…"; }
  const r = await rpc("g_load", {p_name: name, p_pin: pin});
  if (!r.ok) {
    if (r.error === "bad_login" || r.error === "locked") { store(SK, undefined); ROWS = []; showLogin(ERR[r.error]); }
    else if (fromForm || !fetchStore(SK)) showLogin(ERR[r.error] || "오류: " + (r.error || r.message || "알 수 없음"));
    else if (!ROWS.length) { view("load"); $("loadView").textContent = ERR[r.error] || "불러오지 못했어요. 잠시 뒤 새로고침해 주세요."; }
    return;
  }
  store(SK, {name, pin});
  applyData(r);
}
$("loginForm").onsubmit = e => { e.preventDefault(); const n = $("inName").value.trim(), p = $("inPin").value.trim();
  if (!n || !p) { $("loginMsg").textContent = "이름과 PIN을 입력해주세요."; $("loginMsg").className = "msg bad"; return; } load(n, p, true); };
$("logout").onclick = () => { store(SK, undefined); ROWS = []; $("inPin").value = ""; showLogin(""); };
document.addEventListener("visibilitychange", () => { const s = fetchStore(SK); if (document.visibilityState === "visible" && s && !$("appView").hidden) load(s.name, s.pin); });
const saved = fetchStore(SK);
if (saved) load(saved.name, saved.pin); else showLogin("");
</script>
